            spinBtn.classList.add('opacity-75', 'cursor-not-allowed');

            if (pool.length === 0) {
                pool = themes;
            }

            let counter = 0;
            const totalSteps = 18; // パラパラ変わる回数
            let intervalTime = 50;

            const rollInterval = setInterval(() => {
                const randomItem = pool[Math.floor(Math.random() * pool.length)];

                counter++;

                // だんだん遅くする演出

                    clearInterval(rollInterval);
                    slowDownRoll(pool, display, spinBtn);
                }
            }, intervalTime);
        }

        // スローダウン演出
        function slowDownRoll(pool, display, spinBtn) {
            let steps = 0;
            const maxSteps = 5;
            let currentDelay = 100;

            function nextStep() {
                if (steps < maxSteps) {
                    const randomItem = pool[Math.floor(Math.random() * pool.length)];
                    display.innerText = randomItem.text;
                    steps++;
                    currentDelay += 80;
                    setTimeout(nextStep, currentDelay);
                } else {
                    // 最終決定
                    const finalItem = pool[Math.floor(Math.random() * pool.length)];
                    currentTheme = finalItem;
                    display.innerText = finalItem.text;
                    display.classList.remove('rolling');

                    // 履歴に追加
                    addHistory(finalItem);

                    // ボタン復帰
                    spinBtn.disabled = false;
                    spinBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                    isSpinning = false;

                    // お気に入りボタンの状態更新
                    updateFavoriteButtonState();
                }
            }
            setTimeout(nextStep, currentDelay);
        }

        // 履歴追加
        function addHistory(item) {
            // 重複チェックまたは常に先頭に追加
            history.unshift({ ...item, timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
            if (history.length > 30) history.pop(); // 最大30件
            localStorage.setItem('gacha_history', JSON.stringify(history));
            updateLists();
        }

        // お気に入りトグル
        function toggleFavoriteCurrent() {
            if (!currentTheme) {
                showToast("先にお題をガチャってください！");
                return;
            }

            const index = favorites.findIndex(f => f.id === currentTheme.id);
            if (index > -1) {
                favorites.splice(index, 1);
                showToast("お気に入りから削除しました");
            } else {
                favorites.push(currentTheme);
                showToast("お気に入りに追加しました！ ❤️");
            }
            localStorage.setItem('gacha_favorites', JSON.stringify(favorites));
            updateFavoriteButtonState();
            updateLists();
        }

        // お気に入りボタンの見た目更新
        function updateFavoriteButtonState() {
            const favBtn = document.getElementById('fav-btn');
            if (!currentTheme) return;
            const isFav = favorites.some(f => f.id === currentTheme.id);
            if (isFav) {
                favBtn.className = "text-red-500 text-2xl transition-colors transform scale-110";
            } else {
                favBtn.className = "text-slate-300 hover:text-red-500 text-2xl transition-colors";
            }
        }

        // リスト更新（履歴＆お気に入り）
        function updateLists() {
            // カウント更新
            document.getElementById('history-count').innerText = history.length;
            document.getElementById('fav-count').innerText = favorites.length;

            // 履歴描画
            const historyContainer = document.getElementById('view-history');
            if (history.length === 0) {
                historyContainer.innerHTML = `<div class="text-center text-slate-400 py-6 text-sm">まだ履歴はありません。ガチャを回してみよう！</div>`;
            } else {
                historyContainer.innerHTML = history.map((item, idx) => `
                    <div class="flex items-center justify-between bg-slate-50 hover:bg-orange-50 p-3 rounded-xl border border-slate-100 transition-colors">
                        <div class="flex items-center gap-3 pr-2">
                            <span class="text-xs font-bold bg-orange-100 text-orange-600 px-2 py-0.5 rounded">${categoryNames[item.category] || 'お題'}</span>
                            <span class="text-sm font-bold text-slate-700">${item.text}</span>
                        </div>
                        <button onclick="selectHistoryItem(${item.id})" class="text-xs bg-white border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-orange-500 hover:text-white transition-colors shrink-0 font-bold shadow-sm">
                            再表示
                        </button>
                    </div>
                `).join('');
            }

            // お気に入り描画
            const favContainer = document.getElementById('view-favorites');
            if (favorites.length === 0) {
                favContainer.innerHTML = `<div class="text-center text-slate-400 py-6 text-sm">お気に入り登録されたお題はありません。</div>`;
            } else {
                favContainer.innerHTML = favorites.map((item, idx) => `
                    <div class="flex items-center justify-between bg-slate-50 hover:bg-red-50 p-3 rounded-xl border border-slate-100 transition-colors">
                        <div class="flex items-center gap-3 pr-2">
                            <span class="text-xs font-bold bg-red-100 text-red-600 px-2 py-0.5 rounded">${categoryNames[item.category] || 'お題'}</span>
                            <span class="text-sm font-bold text-slate-700">${item.text}</span>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button onclick="selectHistoryItem(${item.id})" class="text-xs bg-white border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-orange-500 hover:text-white transition-colors font-bold shadow-sm">
                                表示
                            </button>
                            <button onclick="removeFavorite(${item.id})" class="text-xs bg-white border border-slate-200 text-red-500 px-2.5 py-1.5 rounded-lg hover:bg-red-500 hover:text-white transition-colors shadow-sm">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        }

        // 履歴やお気に入りからお題を再表示
        function selectHistoryItem(id) {
            const found = themes.find(t => t.id === id);
            if (found) {
                currentTheme = found;
                document.getElementById('theme-display').innerText = found.text;
                updateFavoriteButtonState();
                showToast("お題をメイン画面にセットしました！");
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // お気に入り削除
        function removeFavorite(id) {
            favorites = favorites.filter(f => f.id !== id);
            localStorage.setItem('gacha_favorites', JSON.stringify(favorites));
            updateFavoriteButtonState();
            updateLists();
            showToast("お気に入りから削除しました");
        }

        // タブ切り替え
        function switchTab(tab) {
            const tabHistory = document.getElementById('tab-history');
            const tabFavorites = document.getElementById('tab-favorites');
            const viewHistory = document.getElementById('view-history');
            const viewFavorites = document.getElementById('view-favorites');

            if (tab === 'history') {
                tabHistory.className = "flex-1 pb-3 font-bold text-orange-600 border-b-4 border-orange-500 text-center transition-all";
                tabFavorites.className = "flex-1 pb-3 font-bold text-slate-400 border-b-4 border-transparent text-center transition-all";
                viewHistory.classList.remove('hidden');
                viewFavorites.classList.add('hidden');
            } else {
                tabFavorites.className = "flex-1 pb-3 font-bold text-orange-600 border-b-4 border-orange-500 text-center transition-all";
                tabHistory.className = "flex-1 pb-3 font-bold text-slate-400 border-b-4 border-transparent text-center transition-all";
                viewFavorites.classList.remove('hidden');
                viewHistory.classList.add('hidden');
            }
        }

        // トースト通知表示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = msg;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, -10px)';
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 0)';
            }, 2500);
        }

        // スペースキーでガチャを回せるようにする
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                e.preventDefault();
                spinGacha();
            }
        });
    </script>
</body>
